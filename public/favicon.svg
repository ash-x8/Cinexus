<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140205" />
      <stop offset="50%" stop-color="#090A0F" />
      <stop offset="100%" stop-color="#050102" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0E25" />
      <stop offset="100%" stop-color="#C80016" />
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF0E25" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#80000D" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Rounded Card Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#redGlow)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="256" cy="256" r="160" fill="#FF0E25" opacity="0.2" filter="blur(40px)" />

  <!-- CINEXUS 3D Glossy Symbol (Stylized C & Play Wedge) -->
  <g filter="url(#neonGlow)">
    <!-- Main Outer C Ring segment -->
    <path d="M 330 140 C 290 100, 210 100, 160 150 C 110 200, 110 310, 160 360 C 210 410, 290 410, 330 370 L 370 410 C 310 465, 180 465, 110 390 C 40 315, 40 195, 110 120 C 180 45, 310 45, 370 100 Z" fill="url(#redGlow)" />

    <!-- 3D Play Core Wedge -->
    <path d="M 230 180 L 340 256 L 230 332 Z" fill="url(#redGlow)" />
    <!-- Glossy Highlight Overlay -->
    <path d="M 230 180 L 340 256 L 230 256 Z" fill="url(#gloss)" opacity="0.6" />
  </g>
</svg>
